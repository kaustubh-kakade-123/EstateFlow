spring.application.name=estateflow-backend

# ===============================
# MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/estateflow_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# Server
# ===============================
server.port=8080

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# JWT
# ===============================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# ===============================
# Pagination
# ===============================
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Property image uploads
app.upload.dir=uploads/property-images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
